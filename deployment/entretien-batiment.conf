# Nginx configuration for entretien-batiment.com
# Save this file to /etc/nginx/sites-available/entretien-batiment.conf
# Then enable it with:
#   sudo ln -s /etc/nginx/sites-available/entretien-batiment.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file contains both the HTTP -> HTTPS redirect server and the HTTPS server
# that serves the SPA from /var/www/entretien-batiment and proxies API requests
# to the backend running on 127.0.0.1:8080.
#
# It is compatible with the existing minimal HTTP redirect block you already have;
# if you replace the server file on the server with this one it will behave the
# same but add the SPA fallback and API proxying.

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name entretien-batiment.com www.entretien-batiment.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name entretien-batiment.com www.entretien-batiment.com;

    # TLS certificate (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/entretien-batiment.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entretien-batiment.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Static site root (built frontend)
    root  /var/www/entretien-batiment;
    index index.html;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://entretien-batiment.com wss://www.entretien-batiment.com https://nominatim.openstreetmap.org https://router.project-osrm.org;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Limits and client upload size
    client_max_body_size 50M;
    proxy_buffering off;

    # ACME challenge should work over HTTPS too
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # API proxy (place BEFORE SPA fallback)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Connection "";
    }

    # WebSocket / notifications proxy
    location ^~ /ws-notifications/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Serve static assets with caching
    location ~* \.(?:css|js|json|xml|svg|png|jpg|jpeg|gif|ico|webp|woff2?|ttf|map)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA fallback for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to dotfiles and sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
